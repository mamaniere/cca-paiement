<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CCA Paiement</title>

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f1e8;
  color:#3d2b1f;
  font-family:Arial,sans-serif;
  text-align:center;
}

header{
  background:#6b3f24;
  color:white;
  padding:20px;
}

h1{
  margin:0;
  font-size:28px;
}

#message{
  font-size:22px;
  font-weight:bold;
  margin:25px 15px 15px;
}

#scanner{
  width:min(90vw,500px);
  margin:0 auto;
  background:black;
  border-radius:15px;
  overflow:hidden;
}

#result{
  margin:20px;
  font-size:18px;
}

.ok{
  color:#247a3b;
  font-weight:bold;
}

.error{
  color:#b3261e;
  font-weight:bold;
}


/* =========================
   FENÊTRE DE PAIEMENT
   ========================= */

#paiement{
  display:none;

  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  background:white;

  z-index:1000;
}

#paiement iframe{
  width:100%;
  height:100%;
  border:0;
}

</style>

</head>


<body>


<header>
  <h1>CCA PAIEMENT</h1>
</header>


<div id="scannerPage">

  <div id="message">
    Présentez votre QR code
  </div>

  <div id="scanner"></div>

  <div id="result">
    Initialisation de la caméra...
  </div>

</div>


<!-- =========================
     PAGE DE PAIEMENT
     ========================= -->

<div id="paiement">

  <iframe
    id="paiementFrame"
    allow="camera">
  </iframe>

</div>


<script>


/* =========================
   CONFIGURATION
   ========================= */

const APP_URL =
  "https://script.google.com/macros/s/AKfycbyLwHdP9lETK6d0Y6u8_jhdBlNgKoJZCDxu2RvFKiJ6Ymqyi4GEfsE3UJf1P95GjignMg/exec";


let scanner = null;

let scanEnCours = false;


/* =========================
   EXTRAIRE L'ID DU QR
   ========================= */

function trouverId(texte){

  texte =
    String(texte || "").trim();


  /*
   * QR contenant simplement :
   * CCA002
   */

  if(/^CCA\d+$/i.test(texte)){

    return texte.toUpperCase();

  }


  /*
   * Au cas où le QR contient
   * une URL avec ?id=CCA002
   */

  try{

    const url =
      new URL(texte);

    const id =
      url.searchParams.get("id");


    if(
      id &&
      /^CCA\d+$/i.test(id)
    ){

      return id.toUpperCase();

    }

  }
  catch(e){}


  return null;

}


/* =========================
   QR DÉTECTÉ
   ========================= */

function qrDetecte(texte){

  if(scanEnCours){

    return;

  }


  const id =
    trouverId(texte);


  if(!id){

    document.getElementById(
      "result"
    ).innerHTML =
      '<span class="error">' +
      'QR code non reconnu' +
      '</span>';

    return;

  }


  scanEnCours = true;


  document.getElementById(
    "message"
  ).textContent =
    "Membre identifié";


  document.getElementById(
    "result"
  ).innerHTML =
    '<span class="ok">' +
    'Ouverture du paiement : ' +
    id +
    '</span>';


  /*
   * On arrête la caméra
   */

  if(scanner){

    scanner.stop()
      .catch(function(){});

  }


  /*
   * On affiche la page de paiement
   */

  setTimeout(function(){

    ouvrirPaiement(id);

  },500);

}


/* =========================
   OUVRIR LE PAIEMENT
   ========================= */

function ouvrirPaiement(id){

  const frame =
    document.getElementById(
      "paiementFrame"
    );


  frame.src =
    APP_URL +
    "?id=" +
    encodeURIComponent(id);


  document.getElementById(
    "paiement"
  ).style.display =
    "block";


  document.getElementById(
    "scannerPage"
  ).style.display =
    "none";

}


/* =========================
   RETOUR DU PAIEMENT
   ========================= */

window.addEventListener(
  "message",
  function(event){

    /*
     * On vérifie le message envoyé
     * par Apps Script.
     */

    if(
      !event.data ||
      event.data.type !==
      "CCA_PAIEMENT_TERMINE"
    ){

      return;

    }


    /*
     * On ferme la page de paiement.
     */

    document.getElementById(
      "paiementFrame"
    ).src =
      "about:blank";


    document.getElementById(
      "paiement"
    ).style.display =
      "none";


    document.getElementById(
      "scannerPage"
    ).style.display =
      "block";


    /*
     * Nouveau membre possible.
     */

    scanEnCours = false;


    document.getElementById(
      "message"
    ).textContent =
      "Présentez votre QR code";


    document.getElementById(
      "result"
    ).textContent =
      "Caméra en cours de démarrage...";


    /*
     * On redémarre la caméra avant.
     */

    setTimeout(
      demarrerScanner,
      300
    );

  }
);


/* =========================
   ERREUR DE SCAN
   ========================= */

function erreurScan(errorMessage){

  /*
   * On ne fait rien.
   */

}


/* =========================
   DÉMARRER LE SCANNER
   ========================= */

function demarrerScanner(){

  /*
   * Sécurité :
   * si un ancien scanner existe,
   * on le détruit.
   */

  if(scanner){

    try{

      scanner.clear();

    }
    catch(e){}

  }


  scanner =
    new Html5Qrcode("scanner");


  const config = {

    fps:10,

    qrbox:{
      width:250,
      height:250
    }

  };


  scanner.start(

    /*
     * CAMÉRA AVANT
     */

    {
      facingMode:"user"
    },

    config,

    qrDetecte,

    erreurScan

  )

  .then(function(){

    document.getElementById(
      "result"
    ).innerHTML =
      '<span class="ok">' +
      'Caméra avant active' +
      '</span>';

  })

  .catch(function(error){

    document.getElementById(
      "result"
    ).innerHTML =
      '<span class="error">' +
      "Impossible d'accéder à la caméra.<br>" +
      error +
      "</span>";

  });

}


/* =========================
   DÉMARRAGE
   ========================= */

window.addEventListener(
  "load",
  function(){

    setTimeout(
      demarrerScanner,
      500
    );

  }
);


</script>

</body>

</html>
