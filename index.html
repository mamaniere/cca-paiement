<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCA Paiement</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
*{box-sizing:border-box}

:root{
  --green:#087b3f;
  --green-dark:#075b32;
  --green-light:#d9f1d8;
  --brown:#9b321d;
  --border:#d6d6d6
}

body{
  margin:0;
  background:#eef1ee;
  color:#111;
  font-family:Arial,sans-serif;
  text-align:center
}

header{
  background:#fff;
  color:#111;
  padding:14px 20px 10px;
  border-bottom:4px solid var(--green);
  box-shadow:0 1px 4px rgba(0,0,0,.08)
}

.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:34px;
  max-width:980px;
  margin:auto
}

.brandLogo{
  text-align:left;
  min-width:205px;
  line-height:.92
}

.brandLogoMain{
  font-size:46px;
  font-weight:900;
  letter-spacing:-3px;
  color:var(--green)
}

.brandDots{
  color:var(--brown);
  font-size:38px;
  letter-spacing:-8px;
  margin-left:6px;
  vertical-align:5px
}

.brandSub{
  font-size:15px;
  font-weight:700;
  line-height:1.25;
  margin-top:6px
}

.brandTitle{
  text-align:left;
  border-left:1px solid #ddd;
  padding-left:34px
}

.brandTitleMain{
  font-size:38px;
  font-weight:900;
  letter-spacing:1px;
  white-space:nowrap
}

.brandTitleMain .g{
  color:var(--green)
}

.brandTitleMain .b{
  color:var(--brown)
}

.brandTitleSub{
  font-size:18px;
  letter-spacing:6px;
  font-weight:800;
  color:var(--green);
  margin-top:4px
}

main{
  max-width:980px;
  margin:auto;
  padding:18px 22px 28px
}

/* SCANNER */

#scannerPage{
  display:block
}

#message{
  font-size:25px;
  font-weight:800;
  margin:18px 10px;
  color:var(--green-dark)
}

#scanner{
  width:min(90vw,500px);
  margin:auto;
  background:#000;
  border-radius:15px;
  overflow:hidden;
  border:4px solid var(--green)
}

#scannerResult{
  margin:16px;
  font-size:18px
}

.ok{
  color:var(--green);
  font-weight:800
}

.error{
  color:#b3261e;
  font-weight:800
}

/* PAIEMENT */

#paymentPage{
  display:none
}

.member{
  background:var(--green-light);
  border-radius:15px;
  padding:15px 20px;
  margin-bottom:14px;
  border:1px solid #c8e6c6;
  display:grid;
  grid-template-columns:1.55fr .8fr;
  align-items:center;
  text-align:left
}

.memberName{
  font-size:28px;
  font-weight:900;
  color:#0a5530;
  line-height:1.1
}

.memberIdLine{
  font-size:18px;
  margin-top:4px
}

.memberBalance{
  border-left:2px solid rgba(7,91,50,.3);
  padding-left:28px;
  font-size:19px;
  color:#145b35
}

.balance{
  display:block;
  font-size:30px;
  font-weight:900;
  color:#075b32;
  margin-top:2px
}

/* PRODUITS */

.sectionTitle{
  background:var(--brown);
  color:#fff;
  border-radius:11px;
  padding:10px 18px;
  margin:12px 0 9px;
  font-size:24px;
  font-weight:900;
  text-align:left
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px
}

.product{
  background:#fff;
  border:2px solid var(--border);
  border-radius:13px;
  padding:12px 7px;
  min-height:108px;
  font-size:18px;
  color:#111;
  box-shadow:none;
  cursor:pointer
}

.product:active{
  transform:scale(.98)
}

.productIcon{
  font-size:38px;
  line-height:1;
  margin-bottom:5px
}

.productName{
  font-weight:900
}

.productPrice{
  margin-top:6px;
  font-size:20px;
  font-weight:900;
  color:#086b36
}

/* BILLARD */

.billiard-section{
  margin-top:10px
}

.billiardTitle{
  background:#168b4c!important
}

.billiard{
  width:100%;
  background:#fff;
  border:2px solid var(--border);
  border-radius:13px;
  padding:15px;
  font-size:24px;
  font-weight:900;
  color:#111;
  cursor:pointer;
  min-height:105px
}

.billiardIcon{
  font-size:48px;
  line-height:1;
  display:block;
  margin-bottom:5px
}

/* PANIER */

.cart{
  background:#fff;
  border-radius:14px;
  margin-top:13px;
  padding:0 18px 18px;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
  border:1px solid #ddd
}

.cartHeader{
  background:var(--brown);
  color:#fff;
  margin:0 -18px 10px;
  padding:10px 18px;
  border-radius:13px 13px 0 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:24px;
  font-weight:900
}

.clearCart{
  border:0;
  background:transparent;
  color:#fff;
  font-size:18px;
  font-weight:800;
  cursor:pointer
}

.cartLine{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
  padding:10px 0;
  font-size:17px
}

.cartName{
  text-align:left;
  flex:1
}

.cartQty{
  margin:0 10px;
  font-weight:900
}

.cartPrice{
  min-width:65px;
  text-align:right
}

.remove{
  margin-left:10px;
  border:none;
  background:#eee;
  border-radius:6px;
  padding:5px 8px;
  cursor:pointer
}

.total{
  font-size:25px;
  font-weight:900;
  margin-top:12px;
  background:var(--green-light);
  border-radius:11px;
  padding:10px 14px;
  display:flex;
  justify-content:space-between;
  text-align:left;
  color:#075b32
}

.payRow{
  display:grid;
  grid-template-columns:1.9fr .9fr;
  gap:10px
}

.payButton{
  width:100%;
  margin-top:12px;
  padding:17px;
  border:0;
  border-radius:13px;
  background:var(--green);
  color:#fff;
  font-size:22px;
  font-weight:900;
  cursor:pointer
}

.payButton:disabled{
  background:#a7aaad;
  cursor:default
}

.cancelButton{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:2px solid var(--green-dark);
  border-radius:13px;
  background:#fff;
  color:var(--green-dark);
  font-size:20px;
  font-weight:900;
  cursor:pointer
}

#paymentMessage{
  margin-top:12px;
  font-size:18px;
  font-weight:900
}

/* TABLETTE */

@media(max-width:700px){

  main{
    padding:12px 10px 22px
  }

  .brand{
    gap:12px
  }

  .brandLogo{
    min-width:auto
  }

  .brandLogoMain{
    font-size:34px
  }

  .brandSub{
    font-size:11px
  }

  .brandTitle{
    padding-left:12px
  }

  .brandTitleMain{
    font-size:25px
  }

  .brandTitleSub{
    font-size:12px;
    letter-spacing:3px
  }

  .memberName{
    font-size:23px
  }

  .memberBalance{
    font-size:17px;
    padding-left:15px
  }

  .balance{
    font-size:25px
  }

  .products{
    grid-template-columns:repeat(2,1fr)
  }

  .payRow{
    grid-template-columns:1fr
  }

  .sectionTitle{
    font-size:21px
  }
}

@media(max-width:430px){

  .brandTitle{
    display:none
  }

  .brandLogo{
    text-align:center
  }

  .member{
    grid-template-columns:1fr
  }

  .memberBalance{
    border-left:0;
    border-top:1px solid rgba(7,91,50,.25);
    padding:8px 0 0;
    margin-top:8px
  }
}
</style>
</head>

<body>

<header>

  <div class="brand">

    <div class="brandLogo">

      <div class="brandLogoMain">
        CCA <span class="brandDots">••</span>
      </div>

      <div class="brandSub">
        Cercle des chefs d'atelier<br>
        Billard · Carrom · Échecs
      </div>

    </div>

    <div class="brandTitle">

      <div class="brandTitleMain">
        <span class="g">CCA</span>
        <span class="b">PAIEMENT</span>
      </div>

      <div class="brandTitleSub">
        BOISSONS &amp; BILLARD
      </div>

    </div>

  </div>

</header>


<main>

<section id="scannerPage">

  <div id="message">
    Présentez votre QR code
  </div>

  <div id="scanner"></div>

  <div id="scannerResult">
    Initialisation de la caméra...
  </div>

</section>


<section id="paymentPage">


  <div class="member">

    <div>

      <div id="memberName" class="memberName"></div>

      <div class="memberIdLine">
        Membre n° <span id="memberId"></span>
      </div>

    </div>

    <div class="memberBalance">

      Solde :

      <span id="memberBalance" class="balance"></span>

    </div>

  </div>


  <div class="sectionTitle">
    🍷 &nbsp; BOISSONS
  </div>


  <div class="products">


    <button
      class="product"
      onclick="ajouterProduit('Café',0.50)">

      <div class="productIcon">☕</div>

      <div class="productName">
        Café
      </div>

      <div class="productPrice">
        0,50 €
      </div>

    </button>


    <button
      class="product"
      onclick="ajouterProduit('Thé',0.50)">

      <div class="productIcon">🍵</div>

      <div class="productName">
        Thé
      </div>

      <div class="productPrice">
        0,50 €
      </div>

    </button>


    <button
      class="product"
      onclick="ajouterProduit('Eau plate',0.50)">

      <div class="productIcon">💧</div>

      <div class="productName">
        Eau plate
      </div>

      <div class="productPrice">
        0,50 €
      </div>

    </button>


    <button
      class="product"
      onclick="ajouterProduit('Eau gazeuse',0.50)">

      <div class="productIcon">💦</div>

      <div class="productName">
        Eau gazeuse
      </div>

      <div class="productPrice">
        0,50 €
      </div>

    </button>


    <button
      class="product"
      onclick="ajouterProduit('Leffe 50 cl',2.50)">

      <div class="productIcon">🍺</div>

      <div class="productName">
        Leffe 50 cl
      </div>

      <div class="productPrice">
        2,50 €
      </div>

    </button>


    <button
      class="product"
      onclick="ajouterProduit('La Soyeuse 75 cl',9.00)">

      <div class="productIcon">🍾</div>

      <div class="productName">
        La Soyeuse<br>
        75 cl
      </div>

      <div class="productPrice">
        9,00 €
      </div>

    </button>


    <button
      class="product"
      onclick="ajouterProduit('Vin verre',1.00)">

      <div class="productIcon">🍷</div>

      <div class="productName">
        Vin verre
      </div>

      <div class="productPrice">
        1,00 €
      </div>

    </button>


    <button
      class="product"
      onclick="ajouterProduit('Vin carafe 50 cl',4.00)">

      <div class="productIcon">🍷</div>

      <div class="productName">
        Vin carafe<br>
        50 cl
      </div>

      <div class="productPrice">
        4,00 €
      </div>

    </button>

  </div>


  <div class="billiard-section">

    <div class="sectionTitle billiardTitle">
      🎱 &nbsp; BILLARD
    </div>

    <button
      class="billiard"
      onclick="ajouterProduit('Billard',3.00)">

      <span class="billiardIcon">
        🎱
      </span>

      Billard — 3,00 €

    </button>

  </div>


  <div class="cart">

    <div class="cartHeader">

      <span>
        🛒 &nbsp; PANIER
      </span>

      <button
        class="clearCart"
        onclick="viderPanier()">

        🗑 &nbsp; Vider

      </button>

    </div>


    <div id="cartContent">
      Aucun article
    </div>


    <div class="total">

      <span>
        Total
      </span>

      <span id="cartTotal">
        0,00 €
      </span>

    </div>


    <div class="payRow">

      <button
        id="payButton"
        class="payButton"
        onclick="payer()"
        disabled>

        ✓ &nbsp; VALIDER LE PAIEMENT

      </button>


      <button
        class="cancelButton"
        onclick="annulerPaiement()">

        ✕ &nbsp; ANNULER

      </button>

    </div>


    <div id="paymentMessage"></div>

  </div>


</section>

</main>


<script>

const APP_URL =
"https://script.google.com/macros/s/AKfycbyLwHdP9lETK6d0Y6u8_jhdBlNgKoJZCDxu2RvFKiJ6Ymqyi4GEfsE3UJf1P95GjignMg/exec";


let scanner = null;
let scanEnCours = false;
let membre = null;
let panier = [];


function euro(montant) {

  return Number(montant)
    .toFixed(2)
    .replace(".", ",") + " €";

}


function appelerApi(parametres, callback) {

  const nomCallback =
    "ccaCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);

  let termine = false;

  const script =
    document.createElement("script");

  let timeout;


  window[nomCallback] =
    function(data) {

      if (termine) return;

      termine = true;

      delete window[nomCallback];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      clearTimeout(timeout);

      callback(data);

    };


  const params =
    new URLSearchParams(parametres);

  params.set(
    "callback",
    nomCallback
  );


  script.src =
    APP_URL +
    "?" +
    params.toString();


  script.onerror =
    function() {

      if (termine) return;

      termine = true;

      delete window[nomCallback];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      clearTimeout(timeout);

      callback({
        status:"ERROR",
        message:"Impossible de contacter le serveur"
      });

    };


  document.body.appendChild(script);


  timeout =
    setTimeout(function() {

      if (termine) return;

      termine = true;

      delete window[nomCallback];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      callback({
        status:"ERROR",
        message:"Le serveur ne répond pas"
      });

    },15000);

}


function trouverId(texte) {

  texte =
    String(texte || "").trim();


  if (/^CCA\d+$/i.test(texte)) {
    return texte.toUpperCase();
  }


  try {

    const url =
      new URL(texte);

    const id =
      url.searchParams.get("id");

    if (
      id &&
      /^CCA\d+$/i.test(id)
    ) {
      return id.toUpperCase();
    }

  }

  catch(e) {}


  return null;

}


function qrDetecte(texte) {

  if (scanEnCours) return;


  const id =
    trouverId(texte);


  if (!id) {

    document.getElementById(
      "scannerResult"
    ).innerHTML =
      '<span class="error">' +
      "QR code non reconnu" +
      "</span>";

    return;

  }


  scanEnCours = true;


  document.getElementById(
    "message"
  ).textContent =
    "Identification en cours...";


  document.getElementById(
    "scannerResult"
  ).innerHTML =
    '<span class="ok">Membre : ' +
    id +
    "</span>";


  arreterScanner()
    .then(function() {

      rechercherMembre(id);

    });

}


function rechercherMembre(id) {

  appelerApi(
    {
      api:"getMember",
      id:id
    },
    function(resultat) {

      if (
        !resultat ||
        resultat.status !== "OK"
      ) {

        document.getElementById(
          "scannerResult"
        ).innerHTML =
          '<span class="error">' +
          (
            resultat &&
            resultat.message
              ? resultat.message
              : "Membre inconnu"
          ) +
          "</span>";


        scanEnCours = false;


        setTimeout(
          demarrerScanner,
          2000
        );

        return;

      }


      membre = {
        id:resultat.id,
        nom:resultat.nom,
        solde:Number(resultat.solde)
      };


      panier = [];


      afficherPaiement();

    }
  );

}


function afficherPaiement() {

  document.getElementById(
    "scannerPage"
  ).style.display = "none";


  document.getElementById(
    "paymentPage"
  ).style.display = "block";


  document.getElementById(
    "memberName"
  ).textContent =
    membre.nom;


  document.getElementById(
    "memberId"
  ).textContent =
    membre.id;


  document.getElementById(
    "memberBalance"
  ).textContent =
    euro(membre.solde);


  document.getElementById(
    "paymentMessage"
  ).textContent = "";


  afficherPanier();

}


function ajouterProduit(
  produit,
  prix
) {

  const existant =
    panier.find(function(item) {
      return item.produit === produit;
    });


  if (existant) {

    existant.quantite++;

  }

  else {

    panier.push({
      produit:produit,
      prix:prix,
      quantite:1
    });

  }


  afficherPanier();

}


function retirerProduit(produit) {

  const index =
    panier.findIndex(function(item) {
      return item.produit === produit;
    });


  if (index === -1) return;


  panier[index].quantite--;


  if (
    panier[index].quantite <= 0
  ) {

    panier.splice(index,1);

  }


  afficherPanier();

}


function viderPanier() {

  panier = [];

  afficherPanier();

}


function afficherPanier() {

  const contenu =
    document.getElementById(
      "cartContent"
    );

  const totalElement =
    document.getElementById(
      "cartTotal"
    );

  const bouton =
    document.getElementById(
      "payButton"
    );


  if (panier.length === 0) {

    contenu.innerHTML =
      "Aucun article";

    totalElement.textContent =
      "0,00 €";

    bouton.disabled = true;

    return;

  }


  let total = 0;

  let html = "";


  panier.forEach(function(item) {

    const montant =
      item.prix *
      item.quantite;

    total += montant;


    html +=
      '<div class="cartLine">' +

        '<div class="cartName">' +
          item.produit +
        "</div>" +

        '<div class="cartQty">' +
          "× " +
          item.quantite +
        "</div>" +

        '<div class="cartPrice">' +
          euro(montant) +
        "</div>" +

        '<button class="remove" ' +
          'onclick="retirerProduit(\'' +
          item.produit.replace(
            /'/g,
            "\\'"
          ) +
          "')\">" +
          "−" +
        "</button>" +

      "</div>";

  });


  contenu.innerHTML =
    html;


  totalElement.textContent =
    euro(total);


  bouton.disabled = false;

}


function calculerTotal() {

  let total = 0;


  panier.forEach(function(item) {

    total +=
      item.prix *
      item.quantite;

  });


  return Math.round(
    total * 100
  ) / 100;

}


function payer() {

  if (!membre) return;

  if (panier.length === 0) return;


  const total =
    calculerTotal();


  if (membre.solde < total) {

    document.getElementById(
      "paymentMessage"
    ).innerHTML =
      '<span class="error">' +
      "Solde insuffisant" +
      "</span>";

    return;

  }


  const bouton =
    document.getElementById(
      "payButton"
    );


  bouton.disabled = true;

  bouton.textContent =
    "PAIEMENT EN COURS...";


  document.getElementById(
    "paymentMessage"
  ).textContent =
    "Veuillez patienter...";


  const items =
    panier.map(function(item) {

      return {
        produit:item.produit,
        quantite:item.quantite
      };

    });


  appelerApi(
    {
      api:"debit",
      id:membre.id,
      items:JSON.stringify(items)
    },
    function(resultat) {

      if (
        !resultat ||
        resultat.status !== "OK"
      ) {

        bouton.disabled = false;

        bouton.textContent =
          "✓  VALIDER LE PAIEMENT";


        document.getElementById(
          "paymentMessage"
        ).innerHTML =
          '<span class="error">' +
          (
            resultat &&
            resultat.message
              ? resultat.message
              : "Erreur serveur"
          ) +
          "</span>";

        return;

      }


      document.getElementById(
        "memberBalance"
      ).textContent =
        euro(resultat.nouveauSolde);


      document.getElementById(
        "paymentMessage"
      ).innerHTML =
        '<span class="ok">' +
        "Paiement accepté : " +
        euro(resultat.total) +
        "<br>" +
        "Nouveau solde : " +
        euro(resultat.nouveauSolde) +
        "</span>";


      bouton.textContent =
        "PAIEMENT ACCEPTÉ";


      setTimeout(
        retourScanner,
        2000
      );

    }
  );

}


function annulerPaiement() {

  retourScanner();

}


function retourScanner() {

  membre = null;

  panier = [];


  document.getElementById(
    "paymentPage"
  ).style.display = "none";


  document.getElementById(
    "scannerPage"
  ).style.display = "block";


  document.getElementById(
    "message"
  ).textContent =
    "Présentez votre QR code";


  document.getElementById(
    "scannerResult"
  ).innerHTML =
    "Initialisation de la caméra...";


  const bouton =
    document.getElementById(
      "payButton"
    );


  bouton.disabled = true;

  bouton.textContent =
    "✓  VALIDER LE PAIEMENT";


  document.getElementById(
    "paymentMessage"
  ).textContent = "";


  scanEnCours = false;


  setTimeout(
    demarrerScanner,
    300
  );

}


function arreterScanner() {

  if (!scanner) {
    return Promise.resolve();
  }


  const ancienScanner =
    scanner;

  scanner = null;


  return ancienScanner
    .stop()
    .then(function() {

      try {
        ancienScanner.clear();
      }

      catch(e) {}

    })
    .catch(function() {

      try {
        ancienScanner.clear();
      }

      catch(e) {}

    });

}


function demarrerScanner() {

  if (scanner) return;


  const zone =
    document.getElementById(
      "scanner"
    );


  zone.innerHTML = "";


  scanner =
    new Html5Qrcode(
      "scanner"
    );


  const configuration = {

    fps:10,

    qrbox:{
      width:250,
      height:250
    }

  };


  scanner.start(
    {facingMode:"user"},
    configuration,
    qrDetecte,
    function() {}

  )

  .then(function() {

    document.getElementById(
      "scannerResult"
    ).innerHTML =
      '<span class="ok">' +
      "Caméra avant active" +
      "</span>";

  })

  .catch(function(erreur) {

    scanner = null;

    document.getElementById(
      "scannerResult"
    ).innerHTML =
      '<span class="error">' +
      "Impossible d'accéder à la caméra.<br>" +
      erreur +
      "</span>";

  });

}


window.addEventListener(
  "load",
  function() {

    setTimeout(
      demarrerScanner,
      500
    );

  }
);

</script>
